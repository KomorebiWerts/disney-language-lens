<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Lens UI QA</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02050a; }
    .frame {
      position: fixed; inset: 5vh 2vw 7vh;
      background:
        radial-gradient(circle at 50% 36%, rgba(226,190,133,.36), transparent 16%),
        linear-gradient(90deg, rgba(4,7,11,.94) 0 13%, transparent 26% 78%, rgba(4,7,11,.92) 92%),
        linear-gradient(155deg, #17202b, #394241 42%, #101820 76%);
      box-shadow: inset 0 0 110px #000, 0 0 0 8vh #000;
    }
    .figure { position:absolute; bottom:0; width:21%; height:68%; border-radius:48% 48% 5% 5%; background:linear-gradient(#2b2422,#090b0e 72%); filter:blur(2px); }
    .figure.one { left:23%; transform:rotate(-4deg); }
    .figure.two { right:23%; height:75%; transform:rotate(3deg); }
    .time { position:fixed; right:3vw; bottom:4vh; color:#dfe9ef; font:14px Segoe UI,sans-serif; }
  </style>
</head>
<body>
  <div class="frame"><div class="figure one"></div><div class="figure two"></div></div>
  <div class="time">30:27 / 55:18</div>
  <pre id="qa-output" hidden></pre>
  <script>
    window.Translator = undefined;
    window.chrome = {
      storage: {
        sync: {
          get: async (defaults) => defaults
        },
        local: {
          set: async () => undefined
        },
        onChanged: {
          addListener: () => undefined
        }
      },
      runtime: {
        sendMessage: async ({ word, query, mode }) => ({
          ok: true,
          result: {
            word,
            query,
            mode,
            chinese: mode === "word" ? "居高临下的；屈尊俯就的" : "很居高临下，带着优越感",
            phonetic: "/ˈpætrənaɪzɪŋ/",
            partOfSpeech: "adjective",
            definition: "Offensively condescending; treating someone as if they were less intelligent.",
            example: "Yes, it was quite patronizing.",
            translationSource: "browser-local",
            cached: false,
            audio: ""
          }
        })
      }
    };
  </script>
  <script src="../core.js"></script>
  <script src="../dictionary-core.js"></script>
  <script src="../content-ui.js"></script>
  <script>
    setTimeout(() => {
      window.postMessage({
        channel: "disney-language-lens:v1",
        sender: "page-adapter",
        type: "health",
        ready: true,
        displayTime: "30:27",
        clockSource: "timeline",
        englishTrack: "English [CC]",
        chineseTrack: "Chinese (Simplified)"
      }, "*");
      window.postMessage({
        channel: "disney-language-lens:v1",
        sender: "page-adapter",
        type: "caption",
        english: "Yes, it was quite patronizing. I thought it was a bit too far, actually.",
        chinese: "是的，你这是自以为高人一等。我其实觉得挺过分的。"
      }, "*");
      setTimeout(() => {
        const root = document.getElementById("disney-language-lens-root")?.shadowRoot;
        const target = [...(root?.querySelectorAll("button.word") || [])]
          .find((button) => button.dataset.lookup === "patronizing");
        target?.click();
        setTimeout(() => {
          const card = root?.querySelector(".card");
          const result = {
            visible: Boolean(card && !card.hidden && getComputedStyle(card).display !== "none"),
            query: root?.querySelector(".context-query")?.textContent || "",
            meaning: root?.querySelector(".chinese-meaning")?.textContent || "",
            definition: root?.querySelector(".definition")?.textContent || "",
            modes: [...(root?.querySelectorAll(".mode-button") || [])].map((button) => button.textContent),
            activeMode: root?.querySelector('.mode-button[data-active="true"]')?.textContent || ""
          };
          const passed = result.visible &&
            result.query === "it was quite patronizing" &&
            result.meaning.includes("居高临下") &&
            result.definition.includes("condescending") &&
            result.modes.includes("quite patronizing") &&
            result.activeMode === "语境";
          document.documentElement.dataset.wordCardResult = passed ? "pass" : "fail";
          document.getElementById("qa-output").textContent = JSON.stringify(result);
        }, 900);
      }, 120);
    }, 80);
  </script>
</body>
</html>
